<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ladungssicherungs-Rechner</title>
</head>

<body>

    <h1>Ladungssicherungs-Rechner</h1>

    <p>Berechnung der erforderlichen Sicherungskraft.</p>

    <h2>Ladungsdaten</h2>

    <label for="gewicht">Gewicht der Ladung in kg:</label>
    <input type="number" id="gewicht" placeholder="z. B. 1000">

    <br><br>

    <label for="reibung">Reibbeiwert:</label>
    <select id="reibung">
        <option value="0.2">0,2</option>
        <option value="0.3">0,3</option>
        <option value="0.4">0,4</option>
        <option value="0.5">0,5</option>
        <option value="0.6">0,6</option>
    </select>

    <br><br>

    <button onclick="berechnen()">Berechnen</button>

    <h2>Ergebnis</h2>

    <p id="ergebnis">Noch keine Berechnung durchgeführt.</p>

    <script>
        function berechnen() {

            let gewicht = Number(document.getElementById("gewicht").value);
            let reibung = Number(document.getElementById("reibung").value);

            let erforderlicheSicherung = gewicht * (0.8 - reibung);

            if (erforderlicheSicherung < 0) {
                erforderlicheSicherung = 0;
            }

            document.getElementById("ergebnis").innerHTML =
                "Erforderliche zusätzliche Sicherungskraft nach vorne: "
                + erforderlicheSicherung.toFixed(0)
                + " daN";
        }
    </script>

</body>
</html>
