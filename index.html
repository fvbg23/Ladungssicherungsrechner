<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ladungssicherungs-Rechner</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f5f7;
    padding: 20px;
    max-width: 600px;
    margin: auto;
}

h1 {
    color: #17365d;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccd5df;
    border-radius: 8px;
    background: white;
    font-size: 16px;
    box-sizing: border-box;
}

input:focus, select:focus {
    outline: 2px solid #2877bc;
}


button {
    background: #233f69;
    color: white;
    border: none;
    padding: 15px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}


.ergebnis {
    background: white;
    padding: 20px;
    margin-top: 25px;
    border-radius: 8px;
}

.logo {
    display: block;
    max-width: 250px;
    width: 80%;
    height: auto;
    margin: 0 auto 25px auto;
}

@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    h1 {
        font-size: 26px;
    }

    button {
        width: 100%;
    }
}

    
</style>
</head>

<body>

<img
    src="IMG_5742.png"
    alt="Ansorge Logistik"
    class="logo"
>

    
<h1>Ladungssicherungs-Rechner</h1>

<p>Demonstration einer vereinfachten Berechnung
für das Niederzurren.</p>

<label>Ladungsgewicht (kg)</label>
<input type="number" id="gewicht" value="1000" min="0">

<label>Reibbeiwert</label>
<select id="reibung">
<option value="0.2">0,2</option>
<option value="0.3">0,3</option>
<option value="0.4">0,4</option>
<option value="0.5">0,5</option>
<option value="0.6" selected>0,6</option>
</select>

<label>Vorspannkraft STF (daN)</label>
<input type="number" id="stf" value="350" min="1">

<label>Zurrwinkel (Grad)</label>
<input type="number" id="winkel" value="75" min="1" max="90">

<label>Bereits vorhandene Gurte</label>
<input type="number" id="vorhanden" value="2" min="0">

<button onclick="berechnen()">Berechnen</button>

<div class="ergebnis" id="ergebnis">
Noch keine Berechnung durchgeführt.
</div>

<script>
function berechnen() {

    const gewicht = Number(
        document.getElementById("gewicht").value
    );

    const reibung = Number(
        document.getElementById("reibung").value
    );

    const stf = Number(
        document.getElementById("stf").value
    );

    const winkel = Number(
        document.getElementById("winkel").value
    );

    const vorhanden = Number(
        document.getElementById("vorhanden").value
    );

    const ausgabe = document.getElementById("ergebnis");

    if (
        !Number.isFinite(gewicht) ||
        gewicht <= 0 ||
        !Number.isFinite(stf) ||
        stf <= 0 ||
        !Number.isFinite(winkel) ||
        winkel <= 0 ||
        winkel > 90 ||
        !Number.isInteger(vorhanden) ||
        vorhanden < 0
    ) {
        ausgabe.textContent =
            "Bitte gültige Eingabewerte eingeben.";
        return;
    }

    // Vereinfachtes Lernmodell, keine
    // normgerechte Ladungssicherungsberechnung.

    const sicherungskraft =
        Math.max(0, gewicht * (0.8 - reibung));

    const winkelRad = winkel * Math.PI / 180;

    const kraftProGurt =
        2 * stf * reibung * Math.sin(winkelRad);

    const benoetigt = Math.ceil(
        sicherungskraft / kraftProGurt
    );

    const zusaetzlich = Math.max(
        0, benoetigt - vorhanden
    );

    ausgabe.innerHTML = `
        <h2>Ergebnis (Lernmodell)</h2>

        <p>Zusätzliche Sicherungskraft:
        <strong>${sicherungskraft.toFixed(0)} daN</strong></p>

        <p>Rechnerische Gurtanzahl:
        <strong>${benoetigt}</strong></p>

        <p>Vorhandene Gurte:
        <strong>${vorhanden}</strong></p>

        <h3>Rechnerisch zusätzlich:
        ${zusaetzlich} Gurte</h3>

        <p><small>
        Achtung: Vereinfachtes Lernmodell.
        Nicht zur praktischen Ladungssicherung
        verwenden.
        </small></p>
    `;
}
</script>

</body>
</html>
